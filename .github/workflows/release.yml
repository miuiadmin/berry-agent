# 发布腿（发布道 CI 化定形注 2026-09-15——OIDC trusted publishing 常轨）
#
# 触发 = push tag v*（本机触发腿交棒）；workflow_dispatch = CI 机器演习位
# （钉最新已发 tag ref 幂等空转复验形——禁 dev/main 直跑，首步 ref 断言
# 机制化执法）。发布物从 tag 树在 CI 重建再验收（六道契约全量重跑），
# publish 经 OIDC 免令牌免 2FA（npmjs.com 包设置已绑本仓 + workflow 三元组）。
# 双包同腿（2026-09-20 SDK CI 化批）：触发 glob v* + sdk-v* 两族——SDK 包
# 自本批起经同一编舞 OIDC 发布（publishMode 翻 token→ci，两依赖〔npmjs.com
# 侧绑定 + 翻转拍板〕同日兑现）；step 9 零参跑 `npm run release`，包键由
# RELEASE_REF 前缀自推（release.mjs derivePkgKey——sdk-v*→sdk / v*→main）。
#
# 链尾 API 快照归档步（归档挂入位批 2026-09-16 拍板 = CI 发布腿——快照
# 双位定形 + 治理子步时序位两笔拍板）：发布成功后把当版 API 面快照挂该版
# GitHub Release（assets 形权威留档——归档件不进 git 史；dev 必需检查 strict
# 下 GITHUB_TOKEN 回写结构性不可达，入仓形弃）。每 v* tag push 必经本腿 =
# 归档全覆盖（令牌应急腿尾 tag push 触发的 run 同经此步兜底）。
name: release

on:
  push:
    # 双包分立两族（2026-09-20 SDK CI 化批——glob 不吞：v* 不匹配 sdk-v* 前缀）
    tags: ['v*', 'sdk-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已发 tag 名（钉最新已发 tag——幂等空转复验形）'
        required: true

# 同 tag 串行防重推并发；publish 中途不被杀跑（发布道 CI 化定形批纪律）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # job 级 timeout（与 ci.yml「job 级 timeout 全覆盖」纪律同源——挂死不烧满
    # runner 缺省 6h 配额）：实测 2m51s（等价跳发形）~7m05s（真 OIDC publish
    # 网络腿——alpha.8 首绿实测），30 定值给 npm publish 网络腿余量档
    timeout-minutes: 30
    # job 级最小面：id-token = OIDC 必需 + contents = Release 归档件挂载位
    #（2026-09-16 归档挂入位批起 read→write〔归档件挂 Release 需写面〕；
    # tag checkout 只需 read、write 涵盖之；写面扩张不破 tag 保护——GITHUB_TOKEN
    # 非 owner 仍被 v* ruleset 拦）；persist-credentials:false
    # ——checkout 后 GITHUB_TOKEN 凭证不落盘（gh 调用走 GH_TOKEN env 显式面）
    permissions:
      id-token: write
      contents: write
    steps:
      # 非 tag ref 禁令机制化：非 refs/tags/v*|sdk-v* 形即红（dispatch 直跑腿
      # 须钉 tag 名——防绕 tag 保护 ruleset 的发布物直跑；双前缀并收 =
      # 2026-09-20 SDK CI 化批——sdk-v tag 同受禁令覆盖）
      - name: ref 断言（refs/tags/v*|sdk-v* 形——非 tag ref 即红）
        run: |
          set -eu
          ref="${{ github.ref }}"
          if [ "$ref" != refs/tags/v* ] && [ "$ref" != refs/tags/sdk-v* ] && [ -n "${{ inputs.tag }}" ]; then
            ref="refs/tags/${{ inputs.tag }}"
          fi
          case "$ref" in
            refs/tags/v*|refs/tags/sdk-v*) echo "RELEASE_REF=$ref" >> "$GITHUB_ENV" ;;
            *) echo "::error::GITHUB_REF 非 refs/tags/v*|sdk-v* 形（禁 dev/main 直跑——发布道 CI 化定形的 ref 纪律）"; exit 1 ;;
          esac
      # persist-credentials:false——checkout 后 GITHUB_TOKEN 凭证不落盘（job 面
      # 只剩 OIDC 面；零写面需求）
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      # tag↔version 一致性断言（乱打 tag 错位在此咬住）——按 tag 前缀判包
      # （2026-09-20 SDK CI 化批：sdk-v 前缀读 SDK 包 package.json / v 前缀
      # 读根 package.json；case 先试 sdk-v 分支——sdk-v* 不匹配 v* 模式，
      # 双保险防 v 剥壳吞 sdk-v 头）
      - name: tag↔version 一致性断言（按前缀判包）
        run: |
          set -eu
          case "$RELEASE_REF" in
            refs/tags/sdk-v*)
              tag_ver="${RELEASE_REF#refs/tags/sdk-v}"
              pkg_ver="$(node -p "JSON.parse(require('fs').readFileSync('packages/berry-agent-sdk/package.json','utf8')).version")"
              ;;
            refs/tags/v*)
              tag_ver="${RELEASE_REF#refs/tags/v}"
              pkg_ver="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
              ;;
          esac
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::tag ${RELEASE_REF#refs/tags/} ≠ 树 version ${pkg_ver}（乱打 tag 错位）"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # 「npm ≥11.5.1 随行」是断言非假设（OIDC publish 版本下限）
      - name: npm 版本下限断言（≥ 11.5.1）
        run: |
          set -eu
          npm -v
          node -e "
            const v = require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) {
              console.error('npm ' + v.join('.') + ' < 11.5.1（OIDC publish 下限）');
              process.exit(1);
            }
          "
      # 同 ci.yml test job 装腿：契约 1 门禁内跑全量测试（gate-exec bwrap 真跑腿，
      # GH runner 无预装；Ubuntu 24.04 AppArmor 默认限制非特权 userns 一并放行）
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      # 六道契约全量（CI 发布腿形——env 判入；publish 经 OIDC；契约 5 只读断言
      # next、契约 6 只校验既有 tag——latest 挪位在本机触发腿收口段）
      - run: npm run release
        env:
          BERRY_AGENT_RELEASE_MODE: ci
      # —— API 面快照归档步（归档挂入位批 2026-09-16 拍板 = CI 发布腿）：
      # 发布成功后把当版
      # API 面快照挂该版 GitHub Release（assets 形权威留档）：归档件不进 git
      # 史（dev 必需检查 strict 下 GITHUB_TOKEN 回写结构性不可达——入仓形弃），
      # 生成单源 = 抽取器 --archive 既有 CLI；查 9 开发树基线位（api/snapshots/）
      # 不由此步填充，回流随纪元点火批。幂等：release 在场 clobber 覆盖
      # （dispatch 复验形重跑无害）；令牌应急腿尾 tag push 触发的 run 同经此步
      # 兜底——每 v*/sdk-v* tag push 必经 CI 腿全覆盖；归档本体 main-only
      # （SDK 包无 API 面快照契约——2026-09-20 SDK CI 化批，见下 if 守卫）。
      - name: API 面快照归档（GitHub Release assets）
        # main-only 守卫：RELEASE_REF 由首步注入（push/dispatch 两形齐覆盖），
        # sdk-v* run 整步跳过（publish 已在上一步走完——跳的是归档不是发布）
        if: ${{ !startsWith(env.RELEASE_REF, 'refs/tags/sdk-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${RELEASE_REF#refs/tags/v}"
          # 归档件生成（同版重跑幂等覆盖；抽取器自足声明发射——契约 1 刚跑
          # build/npm ci 全在场，无需额外装配）
          node tools/extract-api-surface.mjs --archive
          # 后置自证：归档件 = 提交位快照逐字节同（查 1 已绿 ⇒ 真值=快照 ⇒
          # 同源必同；异 = 抽取器环境断裂——fail-loud 不挂废档）
          diff "api/snapshots/${ver}.json" src/contracts/api-surface.json
          # asset 名带版本（下载件自描述）；就地上传名后传
          asset="api/snapshots/api-surface-${ver}.json"
          mv "api/snapshots/${ver}.json" "${asset}"
          if gh release view "v${ver}" >/dev/null 2>&1; then
            gh release upload "v${ver}" "${asset}" --clobber
          else
            # Release 缺席即建（交棒先打形首跑可无 release）；prerelease 判定
            # = 版本串含 '-'（npm 语义同向）
            args=(--title "v${ver}" --notes "版本归档：当版 API 面快照见附件 api-surface-${ver}.json（extract-api-surface --archive 生成）")
            if [[ "${ver}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "v${ver}" "${asset}" "${args[@]}"
          fi
