# 诊断件二段（probe/oidc 分支独占——默认分支/tag 的真身不受影响，出数即删）
# 目的：以 release.yml 文件名铸 OIDC 令牌并重放 npm 交换端点——读 npmjs.com
# 登记面对 (miuiadmin, berry-agent, release.yml) 的权威回话（契约4 ENEEDAUTH
# 定案：npm utils/oidc.js 交换失败只打 verbose 静默跳过 → 无凭证 → ENEEDAUTH，
# 故真因在交换响应体里）。全脚本与 npm utils/oidc.js 同式：audience
# npm:registry.npmjs.org（oidc.js:74）+ POST /-/npm/v1/oidc/token/exchange/
# package/berry-agent（oidc.js:120）。
name: release

on:
  push:
    branches: ['probe/oidc']
    tags: ['probe-oidc-*']

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 铸令牌并重放 npm OIDC 交换
        run: |
          set -eu
          node --input-type=module <<'EOF'
          const out = (s) => console.log(s);
          out("=== [0] env 在场性 ===");
          out(`REQUEST_TOKEN: ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN ? "yes" : "no"}`);
          out(`REQUEST_URL: ${process.env.ACTIONS_ID_TOKEN_REQUEST_URL ? "yes" : "no"}`);
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.append("audience", "npm:registry.npmjs.org");
          out(`=== [1] 铸令牌（audience=npm:registry.npmjs.org——npm oidc.js:74 同式）===`);
          const mint = await fetch(url.href, {
            headers: {
              Accept: "application/json",
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
          });
          const mintJson = await mint.json().catch(() => ({}));
          out(`铸币 HTTP ${mint.status}`);
          const jwt = mintJson.value || "";
          out(`JWT 长度: ${jwt.length}`);
          if (!jwt) process.exit(0);
          const payload = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString("utf8"));
          out("=== [2] JWT 声明（registry 所见面）===");
          out(JSON.stringify(payload, null, 2));
          out("=== [3] 重放交换 POST /-/npm/v1/oidc/token/exchange/package/berry-agent ===");
          const exch = await fetch(
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/berry-agent",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${jwt}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: "{}",
            },
          );
          const exchText = await exch.text();
          out(`交换 HTTP ${exch.status}`);
          try {
            const j = JSON.parse(exchText);
            if (typeof j.token === "string") j.token = `<REDACTED len=${j.token.length}>`;
            out(JSON.stringify(j, null, 2));
          } catch {
            out(exchText.slice(0, 800));
          }
          EOF
