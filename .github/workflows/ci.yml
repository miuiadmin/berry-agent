# CI 门禁（四门禁 + 配套面在场锁 + 随首发节奏三件——CI 化定形批 2026-09-14 兑现）
#
# - 四门禁：typecheck / test / lint:topology / format:check——与提交前本地
#   门禁同源同令，逐门禁分立 job（并行跑 + 单门禁失败独立可见）；
# - 配套面在场锁：SECURITY.md / CODEOWNERS / issue 模板三件被误删或清空
#   时，第一道推流即红（零依赖纯文件检查，最快出结果）；
# - 随首发节奏三件（2026-09-14 首发后解禁接入，条目真源 = CI 化定形批
#   2026-09-14 拍板清单）：
#   audit（npm audit --omit=dev 生产依赖审计）/ release 演习（发布机器
#   六道契约 --dry-run 彩排）/ 安装脚本真跑（registry 现行版净环境装机）。
#
# - CI 对外 PR 降噪降级（2026-09-15 贡献流程批，条目真源 = 2026-09-15
#   贡献流程批定形的对外 PR 治理条款）：
#   release-drill 限 push 事件（发布机器彩排与外部 PR 改动无关——fork PR
#   全链彩排纯耗额度）；纯文档 PR paths-ignore 降级（涉码路径任一即全量跑；
#   **精确列举**而非 '**/*.md' 通配——SECURITY.md 与 .github/ISSUE_TEMPLATE/
#   刻意不在忽略列，repo-files 在场锁对纯文档 PR 仍执法，防「删配套面文件」
#   从降级缝溜过）；concurrency 同 ref 新推取消旧跑（省公共仓额度）。
#
# - 四问评估落地三件（2026-09-15 W1 簇）：
#   ① job 级 timeout-minutes 全覆盖——挂死不再烧满 runner 缺省 6h 配额；
#     定值自实测时长定量级帽（绿跑 34881738624：repo-files 6s /
#     install-script 12s / audit 7s / format 31s / typecheck 26s / test
#     ubuntu 1m47s·macos 1m39s / lint 32s / release-drill 2m38s），约 4-10x
#     余量；
#   ② coverage 收集 job——v8 provider + text/json-summary 双出口 +
#      actions/upload-artifact 归档（不接第三方服务；阈值门禁未拍板不入，
#      先收集后立线）；
#   ③ nightly soak 档——顶层 on 增 schedule（cron '23 19 * * *'＝19:23 UTC，
#      off-minute 律避整点簇）+ workflow_dispatch 手动腿；tools/soak.mjs
#      （W6 同批入仓）quick 三轮。既有 job 以 if 钉 push/PR 事件、soak 钉
#      schedule/dispatch 事件——定时跑不重复全量 CI；concurrency 组键入
#      event_name 隔离（定时 soak 与在飞 push CI 互不取消）。if 判据一律
#      内联平写（不用 YAML 锚点——服务端 schema 对锚点支持面窄，逐字面
#      表达零风险）。
#
# 平台注记：test 走双 OS 矩阵（ubuntu + macOS）——测试面平台分支均自适应
# （sandbox 默认链按平台断言、PTY 用例按 python3 可用性探测跳过），Linux 上
# 全绿路径已核，macOS 腿随矩阵接入；typecheck / lint / format 为平台无关
# 纯静态面，单 OS（ubuntu-latest）跑足。Linux job 须补装 bubblewrap——
# gate-exec 判据门真跑腿走 L3 bwrap 沙箱后端，GH runner 镜像无预装
# （2026-09-15 CI run 34852040696/34877836385 双红实证 spawn bwrap ENOENT）；
# macOS 腿走 seatbelt 后端天然绿，无需装腿。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/docs/**'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.github/*.md'
      - 'packages/**/*.md'
  # nightly soak 档触发腿（19:23 UTC 每日——off-minute 律）
  schedule:
    - cron: '23 19 * * *'
  # 手动腿：soak 档可按需即时触发（不待定时）
  workflow_dispatch:

# 同 ref 新推取消旧跑（push 分支与 PR 各自成组互不干扰；dev 四门禁必需
# 检查设 strict——up-to-date 重跑不受取消影响，被取消的旧跑有新跑接力）。
# 组键入 event_name：nightly schedule/dispatch 与 push/PR 各自成组——
# 定时 soak 不取消在飞 push CI，反之亦然
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 全 job 无写面需求（checkout + 只读检查；release-drill 零推送零留痕）——
# 顶层钉最小权限，GITHUB_TOKEN 不按仓库缺省权限下发；未来真发 job 需写时
# 按 job 单独提权（2026-09-14 扫描三役 F29）
permissions:
  contents: read

jobs:
  # 公开仓配套面在场锁——不装依赖，纯文件检查
  repo-files:
    # schedule/dispatch 只跑 soak 档——夜间/手动不重复全量 CI
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 配套面在场锁（缺席或空即红）
        run: |
          set -eu
          fail=0
          for f in SECURITY.md .github/CODEOWNERS .github/ISSUE_TEMPLATE/bug-report.yml .github/ISSUE_TEMPLATE/feature-request.yml .github/ISSUE_TEMPLATE/config.yml; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::配套面文件缺席或为空：$f"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "配套面五件齐（SECURITY.md / CODEOWNERS / issue 模板三件）"
          fi
          exit $fail

  # 安装脚本锁——脚本语法机器锁 + 公开面文案禁管道直灌 + 真跑装机
  install-script:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测 12s——net 装机腿留注册表抖动余量
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 安装脚本锁（POSIX 语法 + 文案禁管道直灌）
        run: |
          set -eu
          # 语法锁：两脚本须过 POSIX sh 语法检查（shebang 承诺 /bin/sh——按最严方言验）
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          # 文案锁：公开文档面安装指引禁「curl … | sh」管道直灌形——
          # 两段式纪律（连接中段断裂会让 shell 执行半截脚本）。
          # 正则必含 http：只咬真实直灌命令（带 URL），不咬「不要写成
          # curl … | sh」一类警示提及。README*.md glob 恰收根目录全语言
          # README（六件——runner shell 展开形；新译文落位自动入锁）
          if grep -REn 'curl[^|]*http[^|]*\|[[:space:]]*(ba)?sh' README*.md docs/; then
            echo '::error::公开文档面出现「curl … | sh」管道直灌安装形——须为两段式（先落盘再执行）'
            exit 1
          fi
          echo '安装脚本锁绿：语法过 + 零管道直灌'
      - name: 真跑装机（首发后解禁——净环境装 registry 现行版全链冒烟）
        run: |
          set -eu
          sh scripts/install.sh
          # 净场：runner 全局不留装机（setup-node prefix 下 npm rm 即摘）
          npm rm -g berry-agent

  # 生产依赖审计——零 npm ci（audit 只读 lockfile + 注册表元数据，最快出结果）
  audit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 实测 7s
    steps:
      - uses: actions/checkout@v5
      - run: npm audit --omit=dev

  # 发布机器演习——release 六道契约 --dry-run 全真链彩排（build/pack 验收/安装冒烟真做，
  # publish 走 --dry-run 不上传）。临时 bump CI 演习版本号：registry 已有正式发布版而
  # 主干 dist 恒新于已发布版，深对照幂等分支必拒（同版本号不可重发——正确执法非故障）；
  # bump 后走「首发纯判」路径 = 每次真发布前的常态彩排路径，演习对象是发布机器链路
  # 健康，不是「当前版本可发」的断言。
  release-drill:
    # 双重钉：限 push 事件（发布机器彩排与外部 PR 改动无关——fork PR
    # 全链彩排纯耗公共仓额度；夜间 soak 档也不彩排发布链）；若确需彩排，
    # 维护者在 dev 直推即触发
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 实测 2m38s——内嵌四门禁全量彩排，余量给冷缓存 npm ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # 同 test job 装腿：契约 1 门禁内跑全量测试（含 gate-exec bwrap 真跑腿）
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - name: 临时演习版本并提交（避开在场幂等分支；契约 1 工作树净空与 bump 天然
          冲突——真发流程本就是 bump→commit→release，演习同款完整彩排；checkout
          临时副本上提交，零推送零留痕）
        run: |
          git config user.name "ci-drill"
          git config user.email "ci-drill@local"
          npm version 0.0.0-drill.${{ github.run_number }} --no-git-tag-version
          # SDK 包同款临时 bump（双包发布道——两包版本源独立，SDK 真发后
          # tag sdk-v<version> 已在且异 commit 会咬契约 6；bump 并入同一 drill commit）
          npm version 0.0.0-drill.${{ github.run_number }} --no-git-tag-version --prefix packages/berry-agent-sdk
          git commit -am "drill: 临时演习版本（CI 彩排——不推送）"
      - name: 发布演习（--dry-run 全真链，DRILL-EXIT=0 即绿）
        run: npm run release -- --dry-run
      - name: SDK 发布演习（--package sdk --dry-run 全真链，rl 批双包发布道）
        run: npm run release:sdk -- --dry-run

  typecheck:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测 26s——tsc 三连
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # 双 OS 矩阵：唯一带平台分支的面（sandbox 默认链按平台断言 / PTY 用例按
  # python3 可用性探测）；fail-fast 关——单 OS 红不取消另一 OS 的可见性
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # 实测 ubuntu 1m47s / macos 1m39s——含 npm ci + apt 装腿
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Linux L3 沙箱依赖：gate-exec 判据门真跑腿走 bwrap 后端（GH runner 无
      # 预装）；Ubuntu 24.04 起 AppArmor 默认限制非特权 userns——bwrap 建
      # 命名空间会被拒，一并放行（runner 一次性 VM 安全面无虞；|| true 容
      # 参数缺席的旧镜像）
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - run: npm test

  # 覆盖率收集（四问评估基建短板件①）——ubuntu 单 OS 全量跑，v8 provider
  # 插桩；coverage 配置单源 vitest.config.ts（text 表格入日志内联 +
  # json-summary 产物）。产物走 actions/upload-artifact 归档（不接第三方
  # 上报服务）；阈值门禁未拍板不入——先收集后立线。装腿同 test：全量含
  # gate-exec bwrap 真跑腿（无 bwrap 即红——2026-09-15 双红实证在案）
  coverage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # test 面 1m47s + 插桩开销约 2x 估
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - run: npx vitest run --coverage
      - name: 覆盖率产物归档（coverage/ 全目录——json-summary 在内）
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  # nightly soak 档（四问评估「有证据无轨道 → 有轨道」件）——每日 19:23 UTC
  # 定时 + workflow_dispatch 手动；tools/soak.mjs（W6 同批入仓）src 真源直跑
  # （NODE_OPTIONS 注入 tsx loader——零 dist 消费，不跑 build）quick 三轮。
  # 批 B（soak 闭环——研究档 C3/C1'/C2'/C3' 收口）：RSS 帽 384MB（quick 形
  # 冷启动稳态峰实测 ~220MB 的 1.7 倍余量——天级回落态 55-90MB，拦 GB 级
  # 泄漏回归）+ kill 演练 + error 行帽 0 + seq 无洞全判据机器执法；红时
  # 收割三件套现场（soak-result.jsonl / daemon.log / sessions.db——runner
  # 用后即毁，不留即失）+ 自动开 issue（label 查重防刷屏——夜间巡检红了的
  # 「有人收」闭环腿）。issues:write 权限只给本 job（最小面）。
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: soak quick 三轮 + kill 演练 + 全判据（RSS 帽 384MB / error 行帽 0 / seq 无洞）
        run: node tools/soak.mjs --rounds 3 --mode quick --kill-exercise --rss-budget-mb 384
      - name: 红时收割三件套现场（临时根通配——路径含随机尾，逐件列举）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-failure-${{ github.run_id }}
          path: |
            /tmp/berry-soak-*/soak-result.jsonl
            /tmp/berry-soak-*/data/serve/daemon.log
            /tmp/berry-soak-*/data/sessions.db
          if-no-files-found: warn
          retention-days: 30
      - name: 红时自动开 issue（label 查重——已开则评论续账，不刷屏）
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `nightly soak 红了（[run ${context.runId}](${runUrl})，触发：${context.eventName}）。`,
              '',
              '- 三件套现场（soak-result.jsonl / daemon.log / sessions.db）见本 run 的 **soak-failure-' + context.runId + '** artifact（30 天留存）。',
              '- 判据五面：轮次全 ok / kill 演练 / RSS 预算 384MB / daemon.log error 行帽 0 / 全会话 seq 无洞——FAIL 行见 run 日志汇总表。',
              '- 本地复现：`node tools/soak.mjs --rounds 3 --mode quick --kill-exercise --rss-budget-mb 384`（离线自持——零网络零凭证）。',
            ].join('\n');
            const label = 'soak-failure';
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'nightly soak 失败（自动告警）',
                body,
                labels: [label],
              });
            }

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测 32s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:topology

  format:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测 31s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
