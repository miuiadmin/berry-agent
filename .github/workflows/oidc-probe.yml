# OIDC 铸造面探针（临时件——诊断 alpha.3 CI 腿 id-token 剥夺问题，出数即删）
# 对照实验：with-perm（job 级 id-token: write——与 release.yml 同形）vs
# no-perm（不声明——继承仓库缺省只读）。判读：
#   with=yes / no=no  → job 级授予在此仓可用，剥夺系 tag-push 路径特异
#   with=no  / no=no  → job 级擢升在账户/仓库层面被拦（策略面问题）
name: oidc-probe

on:
  push:
    branches: ['probe/oidc']
  workflow_dispatch:

jobs:
  with-perm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: job 级授予形——探 OIDC 铸造面
        run: |
          echo "[with-perm] REQUEST_TOKEN 出席: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "[with-perm] REQUEST_URL 出席: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"

  no-perm:
    runs-on: ubuntu-latest
    steps:
      - name: 无授予对照组——探 OIDC 铸造面
        run: |
          echo "[no-perm] REQUEST_TOKEN 出席: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "[no-perm] REQUEST_URL 出席: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
