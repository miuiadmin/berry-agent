# CI 门禁（四门禁 + 配套面在场锁 + 随首发节奏三件——07 §7.4 #6 兑现）
#
# - 四门禁：typecheck / test / lint:topology / format:check——与提交前本地
#   门禁同源同令，逐门禁分立 job（并行跑 + 单门禁失败独立可见）；
# - 配套面在场锁：SECURITY.md / CODEOWNERS / 中文问题模板三件被误删或清空
#   时，第一道推流即红（零依赖纯文件检查，最快出结果）；
# - 随首发节奏三件（2026-09-14 首发后解禁接入，条目真源 07 §7.4 #6）：
#   audit（npm audit --omit=dev 生产依赖审计）/ release 演习（发布机器
#   六道契约 --dry-run 彩排）/ 安装脚本真跑（registry 现行版净环境装机）。
#
# - CI 对外 PR 降噪降级（2026-09-15 贡献流程批，条目真源 07 §7.4 续件 3）：
#   release-drill 限 push 事件（发布机器彩排与外部 PR 改动无关——fork PR
#   全链彩排纯耗额度）；纯文档 PR paths-ignore 降级（涉码路径任一即全量跑；
#   **精确列举**而非 '**/*.md' 通配——SECURITY.md 与 .github/ISSUE_TEMPLATE/
#   刻意不在忽略列，repo-files 在场锁对纯文档 PR 仍执法，防「删配套面文件」
#   从降级缝溜过）；concurrency 同 ref 新推取消旧跑（省公共仓额度）。
#
# 平台注记：test 走双 OS 矩阵（ubuntu + macOS）——测试面平台分支均自适应
# （sandbox 默认链按平台断言、PTY 用例按 python3 可用性探测跳过），Linux 上
# 全绿路径已核，macOS 腿随矩阵接入；typecheck / lint / format 为平台无关
# 纯静态面，单 OS（ubuntu-latest）跑足。Linux job 须补装 bubblewrap——
# gate-exec 判据门真跑腿走 L3 bwrap 沙箱后端，GH runner 镜像无预装
# （2026-09-15 CI run 34852040696/34877836385 双红实证 spawn bwrap ENOENT）；
# macOS 腿走 seatbelt 后端天然绿，无需装腿。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/docs/**'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.github/*.md'
      - 'packages/**/*.md'

# 同 ref 新推取消旧跑（push 分支与 PR 各自成组互不干扰；dev 四门禁必需
# 检查设 strict——up-to-date 重跑不受取消影响，被取消的旧跑有新跑接力）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 全 job 无写面需求（checkout + 只读检查；release-drill 零推送零留痕）——
# 顶层钉最小权限，GITHUB_TOKEN 不按仓库缺省权限下发；未来真发 job 需写时
# 按 job 单独提权（2026-09-14 扫描三役 F29）
permissions:
  contents: read

jobs:
  # 公开仓配套面在场锁——不装依赖，纯文件检查
  repo-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 配套面在场锁（缺席或空即红）
        run: |
          set -eu
          fail=0
          for f in SECURITY.md .github/CODEOWNERS .github/ISSUE_TEMPLATE/bug-report.yml .github/ISSUE_TEMPLATE/feature-request.yml .github/ISSUE_TEMPLATE/config.yml; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::配套面文件缺席或为空：$f"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "配套面五件齐（SECURITY.md / CODEOWNERS / issue 模板三件）"
          fi
          exit $fail

  # 安装脚本锁——脚本语法机器锁 + 公开面文案禁管道直灌 + 真跑装机
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 安装脚本锁（POSIX 语法 + 文案禁管道直灌）
        run: |
          set -eu
          # 语法锁：两脚本须过 POSIX sh 语法检查（shebang 承诺 /bin/sh——按最严方言验）
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          # 文案锁：公开文档面安装指引禁「curl … | sh」管道直灌形——
          # 两段式纪律（连接中段断裂会让 shell 执行半截脚本）。
          # 正则必含 http：只咬真实直灌命令（带 URL），不咬「不要写成
          # curl … | sh」一类警示提及。README*.md glob 恰收根目录全语言
          # README（六件——runner shell 展开形；新译文落位自动入锁）
          if grep -REn 'curl[^|]*http[^|]*\|[[:space:]]*(ba)?sh' README*.md docs/; then
            echo '::error::公开文档面出现「curl … | sh」管道直灌安装形——须为两段式（先落盘再执行）'
            exit 1
          fi
          echo '安装脚本锁绿：语法过 + 零管道直灌'
      - name: 真跑装机（首发后解禁——净环境装 registry 现行版全链冒烟）
        run: |
          set -eu
          sh scripts/install.sh
          # 净场：runner 全局不留装机（setup-node prefix 下 npm rm 即摘）
          npm rm -g berry-agent

  # 生产依赖审计——零 npm ci（audit 只读 lockfile + 注册表元数据，最快出结果）
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm audit --omit=dev

  # 发布机器演习——release 六道契约 --dry-run 全真链彩排（build/pack 验收/安装冒烟真做，
  # publish 走 --dry-run 不上传）。临时 bump CI 演习版本号：registry 已有正式发布版而
  # 主干 dist 恒新于已发布版，深对照幂等分支必拒（同版本号不可重发——正确执法非故障）；
  # bump 后走「首发纯判」路径 = 每次真发布前的常态彩排路径，演习对象是发布机器链路
  # 健康，不是「当前版本可发」的断言。
  release-drill:
    # 限 push 事件：发布机器彩排与外部 PR 改动无关（外部 PR 不改发布链路；
    # fork PR 跑全链彩排纯耗公共仓额度）。若确需彩排，维护者在 dev 直推即触发
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # 同 test job 装腿：契约 1 门禁内跑全量测试（含 gate-exec bwrap 真跑腿）
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - name: 临时演习版本并提交（避开在场幂等分支；契约 1 工作树净空与 bump 天然
          冲突——真发流程本就是 bump→commit→release，演习同款完整彩排；checkout
          临时副本上提交，零推送零留痕）
        run: |
          git config user.name "ci-drill"
          git config user.email "ci-drill@local"
          npm version 0.0.0-drill.${{ github.run_number }} --no-git-tag-version
          # SDK 包同款临时 bump（07 §8.3 差分⑤——两包版本源独立，SDK 真发后
          # tag sdk-v<version> 已在且异 commit 会咬契约 6；bump 并入同一 drill commit）
          npm version 0.0.0-drill.${{ github.run_number }} --no-git-tag-version --prefix packages/berry-agent-sdk
          git commit -am "drill: 临时演习版本（CI 彩排——不推送）"
      - name: 发布演习（--dry-run 全真链，DRILL-EXIT=0 即绿）
        run: npm run release -- --dry-run
      - name: SDK 发布演习（--package sdk --dry-run 全真链，rl 批双包发布道）
        run: npm run release:sdk -- --dry-run

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # 双 OS 矩阵：唯一带平台分支的面（sandbox 默认链按平台断言 / PTY 用例按
  # python3 可用性探测）；fail-fast 关——单 OS 红不取消另一 OS 的可见性
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Linux L3 沙箱依赖：gate-exec 判据门真跑腿走 bwrap 后端（GH runner 无
      # 预装）；Ubuntu 24.04 起 AppArmor 默认限制非特权 userns——bwrap 建
      # 命名空间会被拒，一并放行（runner 一次性 VM 安全面无虞；|| true 容
      # 参数缺席的旧镜像）
      - name: Linux L3 沙箱依赖（bubblewrap + userns 放行）
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:topology

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
